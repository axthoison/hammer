<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECTUM</title>
    <style>
        
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@800&display=swap');
        
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        #scene-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 2560px; 
            height: 1446px;
            transform: translate(-50%, -50%) scale(var(--scene-scale, 1));
            transform-origin: center center;
            z-index: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 2560px;
            height: 1446px;
            z-index: 0;
        }

        .stars-container {
            position: absolute;
            width: 2560px;
            height: 1446px;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--twinkle-duration) infinite;
            width: 3px;
            height: 3px;
            opacity: 0.5;
        }

        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.2), 
                       0 0 0 6px rgba(255,255,255,0.1), 
                       0 0 15px rgba(255,255,255,0.3);
            animation: shoot var(--shoot-duration) linear infinite;
            pointer-events: none;
        }

        .shooting-star::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
            filter: blur(1px);
        }

        @keyframes twinkle {
            0%, 100% { 
                opacity: 0.8; 
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.3);
            }
        }

        @keyframes shoot {
            0% {
                transform: rotate(315deg) translateX(0);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: rotate(315deg) translateX(-800px);
                opacity: 0;
            }
        }

        #treeLayerLeft, #treeLayerRight, #flagLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 2560px;
            height: 1446px;
            z-index: 4;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #mask2Layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 2560px;
            height: 1446px;
            z-index: 4;
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        #maskLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 2560px;
            height: 1446px;
            z-index: 2;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #main-container {
            position: absolute;
            width: 512px; 
            height: 512px;
            left: 1280px; 
            top: 719px;
            transform: translate(-50%, -50%);
            z-index: 4;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .image-container {
            position: absolute;
            left: 0;
            top: 0;
            width: 410px; 
        }

        #animationFrame {
            width: 100%;
            position: relative;
        }

        #overlayImage {
            position: absolute;
            width: 400px; 
            height: auto;
            left: 138px;
            top: 15px; 
            cursor: pointer;
            user-select: none;
            z-index: 5;
            pointer-events: none;
        }

        .gif-container {
            position: absolute;
            width: 2000px; 
            height: auto;
            left: 340px; 
            top: -210px;
            transform: translateX(-50%);
            z-index: 6;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #gifImage {
            width: 100%;
            height: auto;
        }

        #hammerImage {
            position: absolute;
            width: 102px; 
            height: auto;
            left: 26px; 
            top: 430px; 
            cursor: pointer;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #carImage {
            position: absolute;
            width: 973px; 
            height: auto;
            right: -742px; 
            top: 650px; 
            z-index: 3; 
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #carText {
            position: absolute;
            top: 1080px; 
            left: 1450px; 
            transform: translate(-50%, -50%);
            z-index: 9;
        }

        #textLine1Container {
            width: 600px; 
            text-align: center;
            margin-left: -80px; 
        }

        #textLine1 {
            display: block;
            color: #fc332e;
            font-size: 77px; 
            font-family: "Unbounded", sans-serif;
            font-optical-sizing: auto;
            font-weight: 800;
            font-style: normal;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            text-shadow: -8px 0 6px rgba(2, 8, 8, 0.9);
            line-height: 1; 
        }

        #textLine1Second {
            display: block;
            color: #fc332e;
            font-size: 110px; 
            font-family: "Unbounded", sans-serif;
            font-optical-sizing: auto;
            font-weight: 800;
            font-style: normal;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            text-align: center;
            text-shadow: -8px 0 6px rgba(2, 8, 8, 0.9);
            line-height: 1; 
            letter-spacing: -2px; 
            white-space: nowrap;
        }

        #textLine2 {
            margin-top: 200px;
            margin-left: -200px;
            display: block;
            color: #fbf79a;
            font-size: 60px; 
            font-family: "Unbounded", sans-serif;
            font-optical-sizing: auto;
            font-weight: 800;
            font-style: normal;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            text-shadow: -8px 0 6px rgba(2, 8, 8, 0.9);
        }

        @keyframes drive {
            0% { right: -742px; }
            100% { right: 3200px; }
        }

        @keyframes bling {
            0% { filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.5)); }
            50% { filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9)); }
            100% { filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.5)); }
        }

        @keyframes stoneGlow {
            0% { filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.7)); }
            100% { filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.4)); }
        }

        @keyframes glow {
            0% { filter: drop-shadow(0 0 5px rgba(200, 200, 200, 0.7)); }
            25% { filter: drop-shadow(0 0 15px rgba(200, 200, 200, 0.9)); }
            50% { filter: drop-shadow(0 0 8px rgba(200, 200, 200, 0.7)); }
            75% { filter: drop-shadow(0 0 20px rgba(200, 200, 200, 0.9)); }
            100% { filter: drop-shadow(0 0 5px rgba(200, 200, 200, 0.7)); }
        }

        #switchOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 2s ease-in-out;
        }

        #switchImage {
            width: 512px; 
            height: auto;
            cursor: pointer;
            animation: glow 3s infinite;
            transition: opacity 1s ease-in-out;
        }

        #blackFade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 11;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        @media (max-width: 600px) {
            #scene-container {
                width: 375px; 
                height: 667px;
            }

            #background-image {
                width: 375px;
                height: 667px;
            }

            #maskLayer, #treeLayerLeft, #treeLayerRight, #flagLayer, #mask2Layer {
                display: none;
            }

            #main-container {
                width: 94px; 
                height: 94px;
                left: 188px; 
                top: 354px; 
            }

            .image-container {
                width: 75px; 
                left: 0;
                top: 0;
            }

            #overlayImage {
                width: 68px; 
                left: 32px; 
                top: 6px; 
            }

            #hammerImage {
                width: 19px; 
                left: 5px; 
                top: 79px; 
            }

            .gif-container {
                width: 225px; 
                left: 225px; 
                top: -280px;
                transform: translateX(-50%);
            }

            #carImage {
                width: 150px; 
                right: -109px; 
                top: 367px; 
            }

            #carText {
                top: 388px; 
                left: 234px;
            }

            #textLine1Container {
                width: 150px; 
            }

            #textLine1 {
                font-size: 19px; 
            }

            #textLine1Second {
                font-size: 24px; 
                letter-spacing: -1px; 
            }

            #textLine2 {
                margin-top: 50px; 
                font-size: 15px; 
            }

            .star {
                width: 2px;
                height: 2px;
            }

            .shooting-star {
                width: 2px;
                height: 2px;
                box-shadow: 0 0 0 2px rgba(255,255,255,0.2), 
                           0 0 0 4px rgba(255,255,255,0.1), 
                           0 0 8px rgba(255,255,255,0.3);
            }

            .shooting-star::before {
                width: 38px; 
                height: 1px;
                filter: blur(0.5px);
            }
        }
    </style>
</head>
<body>
    <div id="scene-container">
        <img id="background-image" src="background.png" alt="Background">
        <div class="stars-container"></div>
        <img id="carImage" src="car.png" alt="Car">
        <img id="maskLayer" src="mask.png" alt="Mask Layer">
        <img id="treeLayerLeft" src="copaclayerstanga.png" alt="Tree Layer Left">
        <img id="treeLayerRight" src="copaclayerdreapta.png" alt="Tree Layer Right">
        <img id="flagLayer" src="drapele.png" alt="Flag Layer">
        <img id="mask2Layer" src="mask2.png" alt="Mask 2 Layer">
        <div id="main-container">
            <div class="image-container">
                <img id="animationFrame" src="standing.png" alt="Animation Frame">
                <img id="overlayImage" src="piatra.png" alt="Overlay Image">
                <audio id="winkSound" src="wink.mp3" preload="auto"></audio>
                <audio id="hit1Sound" src="hit1.wav" preload="auto"></audio>
                <audio id="hit2Sound" src="hit2.wav" preload="auto"></audio>
                <audio id="hit3Sound" src="hit3.mp3" preload="auto"></audio>
            </div>
            <div class="gif-container">
                <img id="gifImage" src="outputfinal-unscreen.gif" alt="Final GIF">
            </div>
            <img id="hammerImage" src="hammer.png" alt="Hammer">
        </div>
        <div id="carText">
            <div id="textLine1Container">
                <span id="textLine1">Pionul lui</span>
                <span id="textLine1Second">LENIN</span>
            </div>
            <span id="textLine2">ÎN CURÂND LA CINEMA</span>
        </div>
    </div>
    <div id="switchOverlay">
        <img id="switchImage" src="switch_on.png" alt="Switch">
        <audio id="switchSound" src="switch.mp3" preload="auto"></audio>
        <audio id="ambientSound" src="ambianta.mp3" preload="auto" loop></audio>
    </div>
    <audio id="carSound" src="carsound.mp3" preload="auto"></audio>
    <audio id="musicSound" src="muzica.mp3" preload="auto" loop></audio>
    <div id="blackFade"></div>

    <script>
        // dynamic scaling
        function updateScale() {
            const sceneContainer = document.getElementById('scene-container');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const isMobile = windowWidth <= 600;
            const bgWidth = isMobile ? 375 : 2560;
            const bgHeight = isMobile ? 667 : 1446;
            const scaleWidth = windowWidth / bgWidth;
            const scaleHeight = windowHeight / bgHeight;
            const coverScale = Math.max(scaleWidth, scaleHeight);

            sceneContainer.style.setProperty('--scene-scale', coverScale);
        }


        window.addEventListener('load', updateScale);
        window.addEventListener('resize', updateScale);

        const idleFrames = ["drept.png", "dreaptaochi.png", "wink.png", "dreaptaochi.png", "wink.png", "dreaptaochi.png"];
        const frameDelays = [600, 600, 200, 200, 200, 400];
        let idleIndex = 0;
        let idleTimeout;
        const winkSound = document.getElementById("winkSound");
        const switchSound = document.getElementById("switchSound");
        const ambientSound = document.getElementById("ambientSound");
        const carSound = document.getElementById("carSound");
        const musicSound = document.getElementById("musicSound");
        const hit1Sound = document.getElementById("hit1Sound");
        const hit2Sound = document.getElementById("hit2Sound");
        const hit3Sound = document.getElementById("hit3Sound");
        let clickCount = 0;
        let isHammerClicked = false;

        document.addEventListener("DOMContentLoaded", () => {
            const preloadImages = ["background.png", "mobile.png", "copaclayerstanga.png", "copaclayerdreapta.png", "drept.png", "piatra.png", "hammer.png", "outputfinal-unscreen.gif", "piatra1.png", "piatra2.png", "switch_off.png", "switch_on.png", "mask.png", "car.png", "mask2.png", "drapele.png"];
            preloadImages.forEach(src => {
                const img = new Image();
                img.src = src;
            });

            const switchOverlay = document.getElementById("switchOverlay");
            const switchImage = document.getElementById("switchImage");
            const mainContainer = document.getElementById("main-container");
            const overlayImage = document.getElementById("overlayImage");
            const imageContainer = document.querySelector(".image-container");
            const hammerImage = document.getElementById("hammerImage");
            const gifContainer = document.querySelector(".gif-container");
            const animationFrame = document.getElementById("animationFrame");
            const gifImage = document.getElementById("gifImage");
            const carImage = document.getElementById("carImage");
            const textLine1 = document.getElementById("textLine1");
            const textLine1Second = document.getElementById("textLine1Second");
            const textLine2 = document.getElementById("textLine2");
            const mask2Layer = document.getElementById("mask2Layer");
            const treeLayerLeft = document.getElementById("treeLayerLeft");
            const treeLayerRight = document.getElementById("treeLayerRight");
            const flagLayer = document.getElementById("flagLayer");
            const maskLayer = document.getElementById("maskLayer");
            const starsContainer = document.querySelector(".stars-container");
            const blackFade = document.getElementById("blackFade");

            document.body.style.pointerEvents = "none";
            switchImage.style.pointerEvents = "auto";

            for (let i = 0; i < 300; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 2560}px`;
                star.style.top = `${Math.random() * 1446}px`;
                star.style.width = `${Math.random() * 4 + 1}px`;
                star.style.height = star.style.width;
                star.style.setProperty('--twinkle-duration', `${Math.random() * 4 + 2}s`);
                starsContainer.appendChild(star);
            }

            function createShootingStar() {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.left = `${Math.random() * 2048}px`;
                star.style.top = `${Math.random() * 578}px`;
                const duration = Math.random() * 4 + 4;
                star.style.setProperty('--shoot-duration', `${duration}s`);
                starsContainer.appendChild(star);
                
                setTimeout(() => {
                    star.remove();
                }, duration * 1000);
            }

            setInterval(createShootingStar, 2000);

            switchImage.addEventListener("click", function switchHandler() {
                switchImage.src = "switch_off.png";
                switchSound.volume = 0.2;
                switchSound.play().catch(error => console.error("Audio Error:", error));

                ambientSound.volume = 0.5;
                setTimeout(() => {
                    ambientSound.play().catch(error => console.error("Ambient Audio Error:", error));
                }, 500);

                setTimeout(() => {
                    switchImage.style.opacity = "0";
                    setTimeout(() => {
                        switchOverlay.style.opacity = "0";
                        maskLayer.style.opacity = "1";
                        treeLayerLeft.style.opacity = "1";
                        treeLayerRight.style.opacity = "1";
                        flagLayer.style.opacity = "1";
                        mainContainer.style.opacity = "1";
                        overlayImage.style.opacity = "1";
                        hammerImage.style.opacity = "1"; 
                        document.body.style.pointerEvents = "none";
                        hammerImage.style.pointerEvents = "auto"; 
                        setTimeout(() => {
                            hammerImage.style.animation = "bling 2s infinite"; 
                        }, 3500); 
                        setTimeout(() => {
                            switchOverlay.style.display = "none";
                            switchImage.style.pointerEvents = "none";
                        }, 2000);
                    }, 1000);
                }, 500);

                switchImage.removeEventListener("click", switchHandler);
            });

            hammerImage.addEventListener("click", () => {
                if (!isHammerClicked) {
                    isHammerClicked = true;
                    hammerImage.style.opacity = "0";
                    
                    setTimeout(() => {
                        hammerImage.style.display = "none";
                        hammerImage.style.pointerEvents = "none";
                        document.body.style.pointerEvents = "none";
                        animationFrame.src = "drept.png";
                        imageContainer.style.opacity = "1";
                        
                        setTimeout(() => {
                            overlayImage.style.animation = "stoneGlow 2s infinite";
                            overlayImage.style.pointerEvents = "auto";
                            overlayImage.addEventListener("click", playClickAnimation);
                        }, 3000);

                        setTimeout(() => {
                            playIdleAnimation();
                        }, 2000);
                    }, 500);
                }
            });
        });

        function playIdleAnimation() {
            function nextFrame() {
                if (idleIndex >= idleFrames.length) {
                    idleIndex = 0;
                    idleTimeout = setTimeout(playIdleAnimation, 2000);
                    return;
                }

                document.getElementById("animationFrame").src = idleFrames[idleIndex];
                if (idleFrames[idleIndex] === "wink.png" && idleIndex === 2) {
                    winkSound.play().catch(error => console.error("Audio Error:", error));
                    winkSound.volume = 0.2;
                }

                idleTimeout = setTimeout(() => {
                    idleIndex++;
                    nextFrame();
                }, frameDelays[idleIndex]);
            }

            idleIndex = 0;
            nextFrame();
        }

        function playClickAnimation() {
            clearTimeout(idleTimeout);
            idleTimeout = null;

            const frame = document.getElementById("animationFrame");
            const overlayImage = document.getElementById("overlayImage");
            const gifContainer = document.querySelector(".gif-container");
            const gifImage = document.getElementById("gifImage");
            const carImage = document.getElementById("carImage");
            const textLine1 = document.getElementById("textLine1");
            const textLine1Second = document.getElementById("textLine1Second");
            const textLine2 = document.getElementById("textLine2");
            const mask2Layer = document.getElementById("mask2Layer");
            const blackFade = document.getElementById("blackFade");

            frame.src = "stanga.png";
            setTimeout(() => {
                frame.src = "dreapta.png";
            }, 500);

            clickCount++;
            if (clickCount === 1) {
                overlayImage.style.animation = "none";
                hit1Sound.volume = 0.3;
                hit1Sound.play().catch(error => console.error("Hit1 Audio Error:", error));
                overlayImage.src = "piatra1.png";
            } else if (clickCount === 2) {
                hit2Sound.volume = 0.3;
                hit2Sound.play().catch(error => console.error("Hit2 Audio Error:", error));
                overlayImage.src = "piatra2.png";
            } else if (clickCount === 3) {
                hit3Sound.volume = 0.3;
                hit3Sound.play().catch(error => console.error("Hit3 Audio Error:", error));

                setTimeout(() => {
                    overlayImage.style.opacity = "0";
                    overlayImage.style.pointerEvents = "none";
                    gifImage.src = "";
                    gifImage.src = "outputfinal-unscreen.gif";
                    gifContainer.style.opacity = "1";

                    setTimeout(() => {
                        frame.style.transition = "opacity 1s ease-in-out";
                        gifContainer.style.transition = "opacity 1s ease-in-out";
                        frame.style.opacity = "0";
                        gifContainer.style.opacity = "0";

                        setTimeout(() => {
                            carSound.volume = 0.4;
                            setTimeout(() => { carSound.play().catch(error => console.error("Car Audio Error:", error)); }, 2000);

                            setTimeout(() => {
                                mask2Layer.style.opacity = "1";
                                carImage.style.opacity = "1";
                                carImage.style.animation = "drive 5s linear forwards";

                                setTimeout(() => {
                                    textLine1.style.opacity = "1";
                                    textLine1Second.style.opacity = "1";
                                    setTimeout(() => {
                                        textLine2.style.opacity = "1";
                                        setTimeout(() => {
                                            blackFade.style.opacity = "1";            
                                            setTimeout(() => {
                                                window.location.href = "side2.html";
                                            }, 1000);
                                        }, 4000);
                                    }, 1000);
                                }, 6000);
                            }, 7000);
                        }, 1000);
                    }, 2000);
                }, 500);

                clickCount = 0;
            }
        }
    </script>
</body>
</html>
