<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hammer Animation with Stars</title>
    <style>
        body {
            text-align: center;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #1a1a1a;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        .stars-container {
            position: fixed;
            width: 100%;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--twinkle-duration) infinite;
            width: 3px;
            height: 3px;
            opacity: 0.5;
        }

        .shooting-star {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.2), 
                       0 0 0 6px rgba(255,255,255,0.1), 
                       0 0 15px rgba(255,255,255,0.3);
            animation: shoot var(--shoot-duration) linear infinite;
            pointer-events: none;
        }

        .shooting-star::before {
            content: '';
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
            filter: blur(1px);
        }

        @keyframes twinkle {
            0%, 100% { 
                opacity: 0.8; 
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.3);
            }
        }

        @keyframes shoot {
            0% {
                transform: rotate(315deg) translateX(0);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: rotate(315deg) translateX(-800px);
                opacity: 0;
            }
        }

        #maskLayer {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 2;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #treeLayerLeft, #treeLayerRight, #flagLayer {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 8;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #main-container {
            position: fixed;
            width: 20vw;
            height: 20vw;
            z-index: 4;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .image-container {
            position: absolute;
            left: 0;
            top: 0;
            width: 16vw;
        }

        #animationFrame {
            width: 100%;
            position: relative;
        }

        #overlayImage {
            position: absolute;
            width: 15vw;
            height: auto;
            left: 34%;
            top: 6%;
            cursor: pointer;
            user-select: none;
            z-index: 5;
        }

        .gif-container {
            position: absolute;
            width: 78vw;
            height: auto;
            left: 60%;
            top: -42%;
            transform: translateX(-50%);
            z-index: 6;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #gifImage {
            width: 100%;
            height: auto;
        }

        #hammerImage {
            position: absolute;
            width: 4vw;
            height: auto;
            left: 5%;
            top: 84%;
            cursor: pointer;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #carImage {
            position: fixed;
            width: 38vw;
            height: auto;
            right: 0vw;
            z-index: 7;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #carText {
            position: fixed;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9;
        }

        #textLine1, #textLine2 {
            display: block;
            color: white;
            font-size: 3vw;
            font-family: 'Times New Roman';
            font-weight: bold;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            filter: drop-shadow(0 0 0.8vw rgba(255, 255, 255, 0.6));
        }

        @keyframes drive {
            0% { right: -29vw; }
            100% { right: 125vw; }
        }

        @keyframes bling {
            0% { filter: drop-shadow(0 0 0.1vw rgba(255, 255, 255, 0.5)); }
            50% { filter: drop-shadow(0 0 0.3vw rgba(255, 255, 255, 0.9)); }
            100% { filter: drop-shadow(0 0 0.1vw rgba(255, 255, 255, 0.5)); }
        }

        @keyframes stoneGlow {
            0% { filter: drop-shadow(0 0 0.05vw rgba(255, 255, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 0.15vw rgba(255, 255, 255, 0.7)); }
            100% { filter: drop-shadow(0 0 0.05vw rgba(255, 255, 255, 0.4)); }
        }

        @keyframes glow {
            0% { filter: drop-shadow(0 0 0.2vw rgba(200, 200, 200, 0.7)); }
            25% { filter: drop-shadow(0 0 0.6vw rgba(200, 200, 200, 0.9)); }
            50% { filter: drop-shadow(0 0 0.3vw rgba(200, 200, 200, 0.7)); }
            75% { filter: drop-shadow(0 0 0.8vw rgba(200, 200, 200, 0.9)); }
            100% { filter: drop-shadow(0 0 0.2vw rgba(200, 200, 200, 0.7)); }
        }

        #mask2Layer {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 8;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #switchOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 2s ease-in-out;
        }

        #switchImage {
            width: 30vw;
            height: auto;
            cursor: pointer;
            animation: glow 3s infinite;
            transition: opacity 1s ease-in-out;
        }

        #blackFade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 11;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        @media (max-width: 600px) {
            body {
                background: url('mobile.png') no-repeat center center fixed;
                background-size: cover;
                background-color: #1a1a1a;
            }

            #maskLayer, #treeLayerLeft, #treeLayerRight, #flagLayer, #mask2Layer {
                display: none;
            }

            #main-container {
                width: 25vw;
                height: 25vw;
            }

            .image-container {
                width: 20vw;
                left: 0;
                top: 0;
            }

            #overlayImage {
                width: 18vw;
                left: 34%;
                top: 6%;
            }

            #hammerImage {
                width: 5vw;
                left: 5%;
                top: 84%;
            }

            .gif-container {
                width: 60vw;
                left: 60%;
                top: -42%;
                transform: translateX(-50%);
            }

            #carImage {
                width: 40vw;
                right: -29vw;
            }

            #textLine1, #textLine2 {
                font-size: 5vw;
            }

            .star {
                width: 0.5vw;
                height: 0.5vw;
            }

            .shooting-star {
                width: 0.5vw;
                height: 0.5vw;
                box-shadow: 0 0 0 0.5vw rgba(255,255,255,0.2), 
                           0 0 0 1vw rgba(255,255,255,0.1), 
                           0 0 2vw rgba(255,255,255,0.3);
            }

            .shooting-star::before {
                width: 10vw;
                height: 0.15vw;
                filter: blur(0.15vw);
            }
        }
    </style>
</head>
<body>
    <div id="switchOverlay">
        <img id="switchImage" src="switch_on.png" alt="Switch">
        <audio id="switchSound" src="switch.mp3" preload="auto"></audio>
        <audio id="ambientSound" src="ambianta.mp3" preload="auto" loop></audio>
    </div>
    <div class="stars-container"></div>
    <img id="maskLayer" src="mask.png" alt="Mask Layer" loading="lazy">
    <img id="treeLayerLeft" src="copaclayerstanga.png" alt="Tree Layer Left" loading="lazy">
    <img id="treeLayerRight" src="copaclayerdreapta.png" alt="Tree Layer Right" loading="lazy">
    <img id="flagLayer" src="drapele.png" alt="Flag Layer" loading="lazy">
    <div id="main-container">
        <div class="image-container">
            <img id="animationFrame" src="standing.png" alt="Animation Frame">
            <img id="overlayImage" src="piatra.png" alt="Overlay Image">
            <audio id="winkSound" src="wink.mp3" preload="auto"></audio>
            <audio id="breakSound" src="stone-break.mp3" preload="auto"></audio>
            <audio id="hit1Sound" src="hit1.wav" preload="auto"></audio>
            <audio id="hit2Sound" src="hit2.wav" preload="auto"></audio>
            <audio id="hit3Sound" src="hit3.mp3" preload="auto"></audio>
        </div>
        <div class="gif-container">
            <img id="gifImage" src="outputfinal-unscreen.gif" alt="Final GIF">
        </div>
        <img id="hammerImage" src="hammer.png" alt="Hammer">
    </div>
    <img id="carImage" src="car.png" alt="Car">
    <div id="carText">
        <span id="textLine1">Pionul lui</span>
        <span id="textLine2">Lenin</span>
    </div>
    <img id="mask2Layer" src="mask2.png" alt="Mask 2 Layer" loading="lazy">
    <audio id="carSound" src="carsound.mp3" preload="auto"></audio>
    <audio id="musicSound" src="muzica.mp3" preload="auto" loop></audio>
    <div id="blackFade"></div>

    <script>
        const idleFrames = ["drept.png", "dreaptaochi.png", "wink.png", "dreaptaochi.png", "wink.png", "dreaptaochi.png"];
        const frameDelays = [600, 600, 200, 200, 200, 400];
        let idleIndex = 0;
        let idleTimeout;
        const winkSound = document.getElementById("winkSound");
        const breakSound = document.getElementById("breakSound");
        const switchSound = document.getElementById("switchSound");
        const ambientSound = document.getElementById("ambientSound");
        const carSound = document.getElementById("carSound");
        const musicSound = document.getElementById("musicSound");
        const hit1Sound = document.getElementById("hit1Sound");
        const hit2Sound = document.getElementById("hit2Sound");
        const hit3Sound = document.getElementById("hit3Sound");
        let clickCount = 0;
        let isHammerClicked = false;

        const preloadImages = ["background.png", "mobile.png", "copaclayerstanga.png", "copaclayerdreapta.png", "drept.png", "piatra.png", "hammer.png", "outputfinal-unscreen.gif", "piatra1.png", "piatra2.png", "switch_off.png", "switch_on.png", "mask.png", "car.png", "mask2.png", "drapele.png"];
        preloadImages.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        // Positioning for #main-container with manual overrides
        function positionMainContainer() {
            const mainContainer = document.getElementById("main-container");
            const pixelRatio = window.devicePixelRatio || 1;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const viewportAspect = viewportWidth / viewportHeight;

            // Manual positions for common resolutions
            const screenPositions = [
                { width: 1920, height: 1080, stonePosition: { x: 0.48, y: 0.50 }, carPosition: { y: 0.45 } },
                { width: 2560, height: 1600, stonePosition: { x: 0.49, y: 0.52 }, carPosition: { y: 0.48 } },
                { width: 1440, height: 900, stonePosition: { x: 0.49, y: 0.52 }, carPosition: { y: 0.48 } },
                { width: 1366, height: 768, stonePosition: { x: 0.49, y: 0.50 }, carPosition: { y: 0.45 } },
                { width: 375, height: 667, stonePosition: { x: 0.49, y: 0.53 }, carPosition: { y: 0.55 } }
            ];

            // Find matching screen resolution
            let stonePosition = { x: 0.48, y: 0.50 }; // Default
            const tolerance = 100;
            for (const screen of screenPositions) {
                if (Math.abs(viewportWidth - screen.width) < tolerance &&
                    Math.abs(viewportHeight - screen.height) < tolerance) {
                    stonePosition = screen.stonePosition;
                    break;
                }
            }

            // Background image aspect ratio (2560x1446)
            const imageAspect = 2560 / 1446;

            // Calculate scaled background size
            let bgWidth, bgHeight, offsetX, offsetY;
            if (viewportAspect > imageAspect) {
                bgHeight = viewportHeight * pixelRatio;
                bgWidth = bgHeight * imageAspect;
                offsetX = ((viewportWidth * pixelRatio) - bgWidth) / 2;
                offsetY = 0;
            } else {
                bgWidth = viewportWidth * pixelRatio;
                bgHeight = bgWidth / imageAspect;
                offsetX = 0;
                offsetY = ((viewportHeight * pixelRatio) - bgHeight) / 2;
            }

            // Calculate stone's pixel position
            const stonePixelX = offsetX + stonePosition.x * bgWidth;
            const stonePixelY = offsetY + stonePosition.y * bgHeight;

            // Center main-container on stone
            mainContainer.style.left = `${stonePixelX / pixelRatio}px`;
            mainContainer.style.top = `${stonePixelY / pixelRatio}px`;
            mainContainer.style.transform = "translate(-50%, -50%)";
        }

        // Positioning for #carImage
        function positionCar() {
            const carImage = document.getElementById("carImage");
            const pixelRatio = window.devicePixelRatio || 1;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const viewportAspect = viewportWidth / viewportHeight;

            // Use same screenPositions as main-container
            const screenPositions = [
                { width: 1920, height: 1080, carPosition: { y: 0.45 } },
                { width: 2560, height: 1600, carPosition: { y: 0.48 } },
                { width: 1440, height: 900, carPosition: { y: 0.48 } },
                { width: 1366, height: 768, carPosition: { y: 0.45 } },
                { width: 375, height: 667, carPosition: { y: 0.55 } }
            ];

            // Find matching screen resolution
            let carPosition = { y: 0.45 }; // Default
            const tolerance = 100;
            for (const screen of screenPositions) {
                if (Math.abs(viewportWidth - screen.width) < tolerance &&
                    Math.abs(viewportHeight - screen.height) < tolerance) {
                    carPosition = screen.carPosition;
                    break;
                }
            }

            // Background image aspect ratio (2560x1446)
            const imageAspect = 2560 / 1446;

            // Calculate scaled background size
            let bgWidth, bgHeight, offsetY;
            if (viewportAspect > imageAspect) {
                bgHeight = viewportHeight * pixelRatio;
                bgWidth = bgHeight * imageAspect;
                offsetY = 0;
            } else {
                bgWidth = viewportWidth * pixelRatio;
                bgHeight = bgWidth / imageAspect;
                offsetY = ((viewportHeight * pixelRatio) - bgHeight) / 2;
            }

            // Calculate car's pixel position (vertical only)
            const carPixelY = offsetY + carPosition.y * bgHeight;

            // Set car position
            carImage.style.top = `${carPixelY / pixelRatio}px`;
        }

        // Initial positioning and update on resize
        window.addEventListener("resize", () => {
            positionMainContainer();
            positionCar();
        });
        window.addEventListener("load", () => {
            positionMainContainer();
            positionCar();
        });

        document.addEventListener("DOMContentLoaded", () => {
            const switchOverlay = document.getElementById("switchOverlay");
            const switchImage = document.getElementById("switchImage");
            const mainContainer = document.getElementById("main-container");
            const overlayImage = document.getElementById("overlayImage");
            const imageContainer = document.querySelector(".image-container");
            const hammerImage = document.getElementById("hammerImage");
            const gifContainer = document.querySelector(".gif-container");
            const animationFrame = document.getElementById("animationFrame");
            const gifImage = document.getElementById("gifImage");
            const carImage = document.getElementById("carImage");
            const textLine1 = document.getElementById("textLine1");
            const textLine2 = document.getElementById("textLine2");
            const mask2Layer = document.getElementById("mask2Layer");
            const treeLayerLeft = document.getElementById("treeLayerLeft");
            const treeLayerRight = document.getElementById("treeLayerRight");
            const flagLayer = document.getElementById("flagLayer");
            const maskLayer = document.getElementById("maskLayer");
            const starsContainer = document.querySelector(".stars-container");
            const blackFade = document.getElementById("blackFade");

            document.body.style.pointerEvents = "none";
            switchImage.style.pointerEvents = "auto";

            for (let i = 0; i < 300; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.width = `${Math.random() * 4 + 1}px`;
                star.style.height = star.style.width;
                star.style.setProperty('--twinkle-duration', `${Math.random() * 4 + 2}s`);
                starsContainer.appendChild(star);
            }

            function createShootingStar() {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.left = `${Math.random() * 80}%`;
                star.style.top = `${Math.random() * 40}%`;
                const duration = Math.random() * 4 + 4;
                star.style.setProperty('--shoot-duration', `${duration}s`);
                starsContainer.appendChild(star);
                
                setTimeout(() => {
                    star.remove();
                }, duration * 1000);
            }

            setInterval(createShootingStar, 2000);

            switchImage.addEventListener("click", function switchHandler() {
                switchImage.src = "switch_off.png";
                switchSound.volume = 0.2;
                switchSound.play().catch(error => console.error("Audio Error:", error));
                
                ambientSound.volume = 0.5;
                setTimeout(() => {
                    ambientSound.play().catch(error => console.error("Ambient Audio Error:", error));
                }, 500);

                setTimeout(() => {
                    switchImage.style.opacity = "0";
                    setTimeout(() => {
                        switchOverlay.style.opacity = "0";
                        maskLayer.style.opacity = "1";
                        treeLayerLeft.style.opacity = "1";
                        treeLayerRight.style.opacity = "1";
                        flagLayer.style.opacity = "1";
                        mainContainer.style.opacity = "1";
                        overlayImage.style.opacity = "1";
                        setTimeout(() => {
                            switchOverlay.style.display = "none";
                            switchImage.style.pointerEvents = "none";
                            setTimeout(() => {
                                hammerImage.style.opacity = "1";
                                document.body.style.pointerEvents = "none";
                                hammerImage.style.pointerEvents = "auto";
                                setTimeout(() => {
                                    hammerImage.style.animation = "bling 2s infinite";
                                }, 3000);
                            }, 3000);
                        }, 2000);
                    }, 1000);
                }, 500);

                switchImage.removeEventListener("click", switchHandler);
            });

            hammerImage.addEventListener("click", () => {
                if (!isHammerClicked) {
                    isHammerClicked = true;
                    hammerImage.style.opacity = "0";
                    
                    setTimeout(() => {
                        hammerImage.style.display = "none";
                        hammerImage.style.pointerEvents = "none";
                        overlayImage.style.pointerEvents = "auto";
                        document.body.style.pointerEvents = "none";
                        
                        animationFrame.src = "drept.png";
                        imageContainer.style.opacity = "1";
                        
                        setTimeout(() => {
                            overlayImage.style.animation = "stoneGlow 2s infinite";
                        }, 3000);

                        setTimeout(() => {
                            playIdleAnimation();
                        }, 2000);

                        overlayImage.addEventListener("click", playClickAnimation);
                    }, 500);
                }
            });
        });

        function playIdleAnimation() {
            function nextFrame() {
                if (idleIndex >= idleFrames.length) {
                    idleIndex = 0;
                    idleTimeout = setTimeout(playIdleAnimation, 2000);
                    return;
                }

                document.getElementById("animationFrame").src = idleFrames[idleIndex];
                if (idleFrames[idleIndex] === "wink.png" && idleIndex === 2) {
                    winkSound.play().catch(error => console.error("Audio Error:", error));
                    winkSound.volume = 0.2;
                }

                idleTimeout = setTimeout(() => {
                    idleIndex++;
                    nextFrame();
                }, frameDelays[idleIndex]);
            }

            idleIndex = 0;
            nextFrame();
        }

        function playClickAnimation() {
            clearTimeout(idleTimeout);
            idleTimeout = null;

            const frame = document.getElementById("animationFrame");
            const overlayImage = document.getElementById("overlayImage");
            const gifContainer = document.querySelector(".gif-container");
            const gifImage = document.getElementById("gifImage");
            const carImage = document.getElementById("carImage");
            const textLine1 = document.getElementById("textLine1");
            const textLine2 = document.getElementById("textLine2");
            const mask2Layer = document.getElementById("mask2Layer");
            const blackFade = document.getElementById("blackFade");

            frame.src = "stanga.png";
            setTimeout(() => {
                frame.src = "dreapta.png";
            }, 500);

            clickCount++;
            if (clickCount === 1) {
                overlayImage.style.animation = "none";
                hit1Sound.volume = 0.3;
                hit1Sound.play().catch(error => console.error("Hit1 Audio Error:", error));
                overlayImage.src = "piatra1.png";
            } else if (clickCount === 2) {
                hit2Sound.volume = 0.3;
                hit2Sound.play().catch(error => console.error("Hit2 Audio Error:", error));
                overlayImage.src = "piatra2.png";
            } else if (clickCount === 3) {
                hit3Sound.volume = 0.3;
                hit3Sound.play().catch(error => console.error("Hit3 Audio Error:", error));
                overlayImage.style.opacity = "0";
                overlayImage.style.pointerEvents = "none";

                gifImage.src = "";
                gifImage.src = "outputfinal-unscreen.gif";
                gifContainer.style.opacity = "1";

                setTimeout(() => {
                    frame.style.transition = "opacity 1s ease-in-out";
                    gifContainer.style.transition = "opacity 1s ease-in-out";
                    frame.style.opacity = "0";
                    gifContainer.style.opacity = "0";

                    setTimeout(() => {
                        carSound.volume = 0.4;
                        setTimeout(() => { carSound.play().catch(error => console.error("Car Audio Error:", error)); }, 2000);

                        setTimeout(() => {
                            mask2Layer.style.opacity = "1";
                            carImage.style.opacity = "1";
                            carImage.style.animation = "drive 5s linear forwards";

                            setTimeout(() => {
                                textLine1.style.opacity = "1";
                                setTimeout(() => {
                                    textLine2.style.opacity = "1";
                                    setTimeout(() => {
                                        blackFade.style.opacity = "1";
                                        setTimeout(() => {
                                            window.location.href = "side2.html";
                                        }, 1000);
                                    }, 4000);
                                }, 1000);
                            }, 6000);
                        }, 7000);
                    }, 1000);
                }, 2000);

                clickCount = 0;
            }
        }
    </script>
</body>
</html>
